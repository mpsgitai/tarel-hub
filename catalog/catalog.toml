# Extension catalog for TAREL. Reading this file imports no plugin and authorizes neither
# installation nor activation. Status reflects verified evidence, never aspirations.
#
# status: builtin       ships inside the TAREL host; no hub package
#         experimental  installable into an unchanged host; review notes before production use
#         planned       not built yet
contract_version = 1

[[extension]]
id = "connector-oracle"
capabilities = ["connector"]
status = "experimental"
package = "tarel-connector-oracle"
import_name = "tarel_connector_oracle"
path = "packages/connector-oracle"
entry_point = { group = "tarel.connectors", name = "oracle" }
host_contract = "connector.v1"
host_versions = "tarel>=0.0.3,<0.1"
dependencies = ["oracledb>=26.1,<27"]
native_requirements = []
license = "MIT (adapter); driver license: see package THIRD_PARTY_NOTICES.md"
origin = "written in this repository"
install = "uv pip install \"git+https://github.com/mpsgitai/tarel-hub.git#subdirectory=packages/connector-oracle\""
real_source_evidence = "Oracle Database 23ai Free (23.26.4) container fixture; URL auth only; revoked SELECT privileges appear as absent objects (not confirmed source deletions)"

