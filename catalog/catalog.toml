host_versions = "part of the host"
dependencies = ["pymssql>=2.3,<3"]
native_requirements = ["FreeTDS, OpenSSL and Kerberos arrive inside the pymssql wheel"]
license = "host MIT; pymssql LGPL-2.1; see docs/inventory.md for the open finding"
