# What exists for TAREL and how to get it. Reading this imports no plugin, and an entry authorizes
# neither installation nor activation. Status says what has really been shown, never what is hoped.
#
# status: builtin       ships inside the host; no hub package
#         experimental  loadable by an unchanged host, not proven against the real source
#         planned       not built; do not expect it to work
contract_version = 1

[[extension]]
id = "connector-oracle"
capabilities = ["connector"]
status = "experimental"
package = "tarel-connector-oracle"
import_name = "tarel_connector_oracle"
path = "packages/connector-oracle"
entry_point = { group = "tarel.connectors", name = "oracle" }
host_contract = "connector.v1"
host_versions = "tested commits: docs/compatibility/connector-oracle.json"
dependencies = ["oracledb>=26.1,<27"]
native_requirements = []
license = "MIT (adapter); driver licenses: see the package THIRD_PARTY_NOTICES.md"
origin = "written in this repository"
install = "uv build packages/connector-oracle, then install the wheel next to the host"
real_source_evidence = "Oracle Database 23ai Free (23.26.4) container fixture, 2026-11-24"

[[extension]]
id = "connector-sqlserver"
capabilities = ["connector"]
status = "builtin"
package = "tarel"
import_name = "tarel.connectors.sqlserver"
entry_point = { group = "built into the host", name = "sqlserver" }
host_contract = "connector.v1"
host_versions = "part of the host"
dependencies = ["pymssql>=2.3,<3"]
native_requirements = ["FreeTDS, OpenSSL and Kerberos arrive inside the pymssql wheel"]
license = "host MIT; pymssql LGPL-2.1; see docs/inventory.md for the open finding"
origin = "TAREL host"
install = "pip install 'tarel[sqlserver]'"
real_source_evidence = "SQL Server 2025 (17.0.1000.7) on Windows, 2026-11-24: SQL login path built in; Windows authentication needs the host auth contract (only a throwaway patch proved it)"
note = "A hub package would be silently ignored today: see docs/host-proposals/0001-connector-name-collision.md"

