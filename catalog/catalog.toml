# What exists for TAREL and how to get it. Reading this imports no plugin, and an entry authorizes
# neither installation nor activation. Status says what has really been shown, never what is hoped.
#
# status: builtin       ships inside the host; no hub package
#         experimental  loadable by an unchanged host, not proven against the real source
#         planned       not built; do not expect it to work
contract_version = 1

[[extension]]
id = "connector-oracle"
capabilities = ["connector"]
status = "experimental"
package = "tarel-connector-oracle"
import_name = "tarel_connector_oracle"
path = "packages/connector-oracle"
entry_point = { group = "tarel.connectors", name = "oracle" }
host_contract = "connector.v1"
host_versions = "tested commits: docs/compatibility/connector-oracle.json"
dependencies = ["oracledb>=26.1,<27"]
native_requirements = []
license = "undecided; see LICENSE-PENDING.md"
origin = "written in this repository"
install = "uv build packages/connector-oracle, then install the wheel next to the host"
real_source_evidence = "BLOCKED: no authorized Oracle instance"

