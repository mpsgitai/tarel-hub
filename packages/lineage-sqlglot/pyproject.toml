[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tarel-lineage-sqlglot"
version = "0.0.1"
description = "Conservative write-centred static SQL lineage analyzer for TAREL using SQLGlot."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MPS" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = [
  "tarel>=0.0.6,<0.1",
  "sqlglot>=30.19,<30.20",
]

[project.urls]
Homepage = "https://github.com/mpsgitai/tarel-hub"
Repository = "https://github.com/mpsgitai/tarel-hub"
Issues = "https://github.com/mpsgitai/tarel-hub/issues"

[project.entry-points."tarel.lineage_analyzers"]
sqlglot = "tarel_lineage_sqlglot.analyzer:create_analyzer"

[tool.hatch.build.targets.wheel]
packages = ["src/tarel_lineage_sqlglot"]

[tool.hatch.build.targets.sdist]
only-include = [
  "LICENSE",
  "README.md",
  "THIRD_PARTY_NOTICES.md",
  "licenses.toml",
  "pyproject.toml",
  "src",
  "tests",
]
