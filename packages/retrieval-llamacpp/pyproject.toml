[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tarel-retrieval-llamacpp"
version = "0.0.1"
description = "Local CPU Qwen3 embedding and reranking plugin for TAREL using llama.cpp."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
dependencies = [
  "tarel>=0.0.5,<0.1",
  "llama-cpp-python>=0.3.16,<0.4",
]

[project.entry-points."tarel.embeddings"]
llamacpp = "tarel_retrieval_llamacpp.plugin:create_embedding_plugin"

[project.entry-points."tarel.rerankers"]
llamacpp = "tarel_retrieval_llamacpp.plugin:create_reranker_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/tarel_retrieval_llamacpp"]

[tool.hatch.build.targets.sdist]
only-include = [
  "LICENSE",
  "README.md",
  "THIRD_PARTY_NOTICES.md",
  "licenses.toml",
  "pyproject.toml",
  "src",
  "tests",
]
